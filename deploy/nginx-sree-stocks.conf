# Redirect all HTTP to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name sreestocktrading.duckdns.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name sreestocktrading.duckdns.org;

    # Let's Encrypt certificate (auto-renewed by certbot.timer)
    ssl_certificate /etc/letsencrypt/live/sreestocktrading.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sreestocktrading.duckdns.org/privkey.pem;

    # Static frontend (Vite build)
    root /opt/sree-stocks/frontend/dist;
    index index.html;

    # API + docs proxy to the FastAPI backend
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location = /docs {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
    }
    location = /openapi.json {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
    }

    # Long-running first scan is normal (populating the candle cache)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Gzip for static assets
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}

